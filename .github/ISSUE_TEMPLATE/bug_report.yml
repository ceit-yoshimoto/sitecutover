name: Bug report
description: Report a reproducible sitecutover defect
title: '[Bug]: '
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, private client URLs, cookies, API keys, or sensitive production data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer example.com, a public test page, or a local fixture over a private client site.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sitecutover version
      placeholder: v0.1.0
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.x
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: textarea
    id: sanitized-output
    attributes:
      label: Sanitized output
      description: Remove secrets and client-sensitive URLs before pasting logs.
